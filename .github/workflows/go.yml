name: Go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: [oldstable, stable]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go }}
    - run: go test -race ./...
    - run: GOARCH=386 go build ./...
    - if: failure()
      run: |
        journalctl --version
        journalctl -F WITH_NEWLINES 'MESSAGE=SmallMessage'; echo "exit=$?"
        journalctl -F WITH_NEWLINES; echo "exit=$?"
        journalctl -o verbose 'MESSAGE=SmallMessage' | head -30

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: stable
        cache: false
    - uses: golangci/golangci-lint-action@v9
      with:
        version: v2.15
